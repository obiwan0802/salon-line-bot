<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ store_name }} - オーナーダッシュボード</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif; background:#f5f5f5; color:#333; }

/* ヘッダー */
.header { background:linear-gradient(135deg,#9B59B6,#7D3C98); color:#fff; padding:16px 20px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,.15); }
.header h1 { font-size:18px; font-weight:700; }
.header small { opacity:.8; font-size:12px; }

/* タブ */
.tabs { display:flex; background:#fff; border-bottom:2px solid #eee; position:sticky; top:56px; z-index:99; overflow-x:auto; }
.tab { flex:1; padding:14px 8px; text-align:center; font-size:13px; font-weight:600; cursor:pointer; border-bottom:3px solid transparent; transition:.2s; color:#888; white-space:nowrap; min-width:0; }
.tab.active { color:#9B59B6; border-bottom-color:#9B59B6; }
.tab:hover { background:#fafafa; }

/* コンテンツ */
.content { max-width:960px; margin:0 auto; padding:16px; }
.panel { display:none; }
.panel.active { display:block; }

/* カード */
.card { background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:12px; overflow:hidden; }
.card-header { padding:14px 16px; font-weight:700; font-size:15px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center; }
.card-body { padding:16px; }

/* フィルター */
.filter-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.filter-btn { padding:8px 16px; border-radius:20px; border:1px solid #ddd; background:#fff; font-size:13px; cursor:pointer; transition:.2s; }
.filter-btn.active { background:#9B59B6; color:#fff; border-color:#9B59B6; }

/* テーブル */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#f8f8f8; padding:10px 12px; text-align:left; font-weight:600; white-space:nowrap; border-bottom:2px solid #eee; }
td { padding:10px 12px; border-bottom:1px solid #f0f0f0; }
tr:hover { background:#fafafa; }

/* ステータスバッジ */
.badge { display:inline-block; padding:3px 10px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-confirmed { background:#e8f5e9; color:#2e7d32; }
.badge-cancelled { background:#fce4ec; color:#c62828; }
.badge-completed { background:#e3f2fd; color:#1565c0; }

/* ボタン */
.btn { padding:6px 14px; border-radius:8px; border:none; font-size:12px; font-weight:600; cursor:pointer; transition:.2s; }
.btn-danger { background:#ffebee; color:#c62828; }
.btn-danger:hover { background:#ef9a9a; color:#fff; }
.btn-primary { background:#9B59B6; color:#fff; }
.btn-primary:hover { background:#7D3C98; }
.btn-secondary { background:#f0f0f0; color:#333; }
.btn-sm { padding:4px 10px; font-size:11px; }

/* フォーム */
.form-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
.form-input, .form-select { padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; }
.form-input:focus, .form-select:focus { outline:none; border-color:#9B59B6; }

/* 定休日リスト */
.closed-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f0f0f0; }
.closed-item:last-child { border:none; }

/* 統計 */
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
.stat-card { background:#fff; border-radius:12px; padding:16px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.stat-number { font-size:28px; font-weight:700; color:#9B59B6; }
.stat-label { font-size:12px; color:#888; margin-top:4px; }

/* ローディング・空状態 */
.loading { text-align:center; padding:40px; color:#999; }
.empty { text-align:center; padding:40px; color:#999; font-size:14px; }

/* 締切ボタン */
.deadline-btn { background:#f0f0f0; color:#333; border:2px solid transparent; border-radius:8px; }
.deadline-btn.active { background:#9B59B6; color:#fff; border-color:#9B59B6; }
.deadline-btn[data-hours="0"].active { background:#2e7d32; border-color:#2e7d32; }

/* スタッフカード */
.staff-card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
.staff-info { display:flex; align-items:center; gap:12px; }
.staff-emoji { font-size:28px; }
.staff-name { font-weight:700; font-size:15px; }
.staff-role { font-size:12px; color:#888; }
.staff-actions { display:flex; gap:6px; }

/* モーダル */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:16px; padding:24px; width:90%; max-width:480px; max-height:80vh; overflow-y:auto; }
.modal h3 { margin-bottom:16px; font-size:18px; }
.modal label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; color:#555; }
.modal input, .modal select { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; }
.modal input:focus, .modal select:focus { outline:none; border-color:#9B59B6; }
.modal-btns { display:flex; gap:8px; margin-top:20px; justify-content:flex-end; }

/* レスポンシブ */
@media(max-width:600px) {
  .tab { font-size:11px; padding:12px 4px; }
  th, td { padding:8px 6px; font-size:12px; }
  .stats { grid-template-columns:repeat(2,1fr); }
  .staff-card { flex-direction:column; align-items:flex-start; }
}
</style>
</head>
<body>

<div class="header" style="display:flex;justify-content:space-between;align-items:center;">
  <div>
    <h1>✂️ {{ store_name }}</h1>
    <small>オーナーダッシュボード</small>
  </div>
  <a href="/dashboard/logout" style="color:#fff;font-size:13px;opacity:.8;text-decoration:none;">ログアウト</a>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('reservations')">📋 予約</div>
  <div class="tab" onclick="switchTab('staff')">💇 スタッフ</div>
  <div class="tab" onclick="switchTab('closeddays')">📅 定休日</div>
  <div class="tab" onclick="switchTab('customers')">👥 顧客</div>
</div>

<div class="content">

  <!-- ===== 予約受付コントロール ===== -->
  <div class="card" id="deadline-control" style="margin-bottom:16px; border-left:4px solid #9B59B6;">
    <div class="card-body" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <div>
        <div style="font-weight:700; font-size:15px;">⏰ 予約受付の締切</div>
        <div id="deadline-status" style="font-size:13px; color:#888; margin-top:4px;">読み込み中...</div>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn deadline-btn" data-hours="0" onclick="setDeadline(0)" style="padding:8px 14px; font-size:13px;">今すぐOK</button>
        <button class="btn deadline-btn" data-hours="1" onclick="setDeadline(1)" style="padding:8px 14px; font-size:13px;">1時間前</button>
        <button class="btn deadline-btn" data-hours="2" onclick="setDeadline(2)" style="padding:8px 14px; font-size:13px;">2時間前</button>
        <button class="btn deadline-btn" data-hours="3" onclick="setDeadline(3)" style="padding:8px 14px; font-size:13px;">3時間前</button>
      </div>
    </div>
  </div>

  <!-- ===== 予約管理パネル ===== -->
  <div id="panel-reservations" class="panel active">
    <div class="stats" id="reservation-stats"></div>
    <div class="filter-bar">
      <button class="filter-btn" onclick="filterRes('today',this)">今日</button>
      <button class="filter-btn active" onclick="filterRes('week',this)">今週</button>
      <button class="filter-btn" onclick="filterRes('month',this)">今月</button>
      <button class="filter-btn" onclick="filterRes('all',this)">すべて</button>
    </div>
    <div class="card">
      <div class="card-header">
        <span>予約一覧</span>
        <button class="btn btn-secondary" onclick="loadReservations()">更新</button>
      </div>
      <div class="card-body">
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>#</th><th>日付</th><th>時間</th><th>お名前</th><th>施術</th><th>担当</th><th>金額</th><th>状態</th><th>操作</th>
            </tr></thead>
            <tbody id="res-body">
              <tr><td colspan="9" class="loading">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== スタッフ管理パネル ===== -->
  <div id="panel-staff" class="panel">
    <div class="card">
      <div class="card-header">
        <span>スタッフ一覧</span>
        <button class="btn btn-primary" onclick="openStaffModal()">＋ 追加</button>
      </div>
      <div class="card-body" id="staff-list">
        <div class="loading">読み込み中...</div>
      </div>
    </div>

    <!-- スタッフ休日 -->
    <div class="card" id="staff-days-off-card" style="display:none; margin-top:12px;">
      <div class="card-header">
        <span id="staff-off-title">スタッフの休日設定</span>
        <button class="btn btn-secondary" onclick="closeStaffDaysOff()">閉じる</button>
      </div>
      <div class="card-body">
        <div id="staff-off-recurring"></div>
        <div class="form-row">
          <select id="staff-off-dow" class="form-select">
            <option value="0">月曜日</option><option value="1">火曜日</option>
            <option value="2">水曜日</option><option value="3">木曜日</option>
            <option value="4">金曜日</option><option value="5">土曜日</option>
            <option value="6">日曜日</option>
          </select>
          <button class="btn btn-primary" onclick="addStaffDayOff('recurring')">定休追加</button>
        </div>

        <div style="margin-top:16px;">
          <div id="staff-off-specific"></div>
          <div class="form-row">
            <input type="date" id="staff-off-date" class="form-input">
            <button class="btn btn-primary" onclick="addStaffDayOff('specific')">休日追加</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 定休日設定パネル ===== -->
  <div id="panel-closeddays" class="panel">
    <div class="card">
      <div class="card-header">毎週の定休日（店舗全体）</div>
      <div class="card-body">
        <div id="recurring-days"></div>
        <div class="form-row">
          <select id="add-dow" class="form-select">
            <option value="0">月曜日</option><option value="1">火曜日</option>
            <option value="2">水曜日</option><option value="3">木曜日</option>
            <option value="4">金曜日</option><option value="5">土曜日</option>
            <option value="6">日曜日</option>
          </select>
          <button class="btn btn-primary" onclick="addRecurring()">追加</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-header">臨時休業日</div>
      <div class="card-body">
        <div id="specific-days"></div>
        <div class="form-row">
          <input type="date" id="add-date" class="form-input">
          <input type="text" id="add-reason" class="form-input" placeholder="理由（例: 研修）" style="flex:1">
          <button class="btn btn-primary" onclick="addSpecific()">追加</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 顧客リストパネル ===== -->
  <div id="panel-customers" class="panel">
    <div class="stats" id="customer-stats"></div>
    <div class="card">
      <div class="card-header">
        <span>顧客一覧</span>
        <button class="btn btn-secondary" onclick="loadCustomers()">更新</button>
      </div>
      <div class="card-body">
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>お名前</th><th>電話番号</th><th>来店回数</th><th>最終来店日</th><th>登録日</th>
            </tr></thead>
            <tbody id="cust-body">
              <tr><td colspan="5" class="loading">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ===== スタッフ追加/編集モーダル ===== -->
<div class="modal-overlay" id="staff-modal">
  <div class="modal">
    <h3 id="staff-modal-title">スタッフ追加</h3>
    <input type="hidden" id="staff-edit-id">
    <label>名前 *</label>
    <input type="text" id="staff-name" placeholder="例: 田中 美咲">
    <label>役割</label>
    <select id="staff-role">
      <option value="スタイリスト">スタイリスト</option>
      <option value="ネイリスト">ネイリスト</option>
      <option value="アイリスト">アイリスト</option>
      <option value="エステティシャン">エステティシャン</option>
    </select>
    <label>絵文字</label>
    <input type="text" id="staff-emoji" placeholder="💇‍♀️" maxlength="4">
    <label>表示順</label>
    <input type="number" id="staff-sort" value="0" min="0">
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeStaffModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveStaff()">保存</button>
    </div>
  </div>
</div>

<script>
const WEEKDAYS = ["月","火","水","木","金","土","日"];
const TAB_NAMES = ["reservations","staff","closeddays","customers"];

// === API呼び出し（Cookie認証） ===
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: {"Content-Type":"application/json"},
    credentials: "same-origin",
    ...opts
  });
  if (res.status === 401) {
    window.location.href = "/dashboard/login";
    return;
  }
  if (!res.ok) throw new Error("API Error: " + res.status);
  return res.json();
}

// === タブ切替 ===
function switchTab(name) {
  document.querySelectorAll(".tab").forEach((t,i) => {
    t.classList.toggle("active", TAB_NAMES[i] === name);
  });
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel-" + name).classList.add("active");

  if (name === "reservations") loadReservations();
  if (name === "staff") loadStaff();
  if (name === "closeddays") loadClosedDays();
  if (name === "customers") loadCustomers();
}

// ━━━━━━━━━━━━━━━━━━━━━━
// 予約管理
// ━━━━━━━━━━━━━━━━━━━━━━
let currentFilter = "week";

function filterRes(period, btn) {
  currentFilter = period;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  loadReservations();
}

async function loadReservations() {
  const tbody = document.getElementById("res-body");
  tbody.innerHTML = '<tr><td colspan="9" class="loading">読み込み中...</td></tr>';
  try {
    const rows = await api("/api/reservations?period=" + currentFilter);
    renderReservations(rows);
    renderResStats(rows);
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">データの取得に失敗しました</td></tr>';
  }
}

function renderReservations(rows) {
  const tbody = document.getElementById("res-body");
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">予約はありません</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const d = new Date(r.reservation_date + "T00:00:00");
    const wd = WEEKDAYS[d.getDay() === 0 ? 6 : d.getDay()-1];
    const dm = (d.getMonth()+1) + "/" + d.getDate();
    const sc = r.status === "confirmed" ? "badge-confirmed" : r.status === "cancelled" ? "badge-cancelled" : "badge-completed";
    const st = r.status === "confirmed" ? "確定" : r.status === "cancelled" ? "キャンセル済" : "完了";
    const cancel = r.status === "confirmed"
      ? `<button class="btn btn-danger btn-sm" onclick="cancelRes(${r.id})">取消</button>` : "-";
    const price = r.total_price ? "¥" + r.total_price.toLocaleString() : "-";
    const staff = r.staff_name || "指名なし";
    return `<tr>
      <td>${r.id}</td>
      <td>${dm}(${wd})</td>
      <td>${r.reservation_time}</td>
      <td><strong>${r.guest_name}</strong></td>
      <td>${r.menu_name}</td>
      <td>${staff}</td>
      <td>${price}</td>
      <td><span class="badge ${sc}">${st}</span></td>
      <td>${cancel}</td>
    </tr>`;
  }).join("");
}

function renderResStats(rows) {
  const confirmed = rows.filter(r => r.status === "confirmed");
  const revenue = confirmed.reduce((s,r) => s + (r.total_price || 0), 0);
  document.getElementById("reservation-stats").innerHTML = `
    <div class="stat-card"><div class="stat-number">${confirmed.length}</div><div class="stat-label">予約件数</div></div>
    <div class="stat-card"><div class="stat-number">¥${revenue.toLocaleString()}</div><div class="stat-label">売上見込</div></div>
  `;
}

async function cancelRes(id) {
  if (!confirm("予約 #" + id + " をキャンセルしますか？\nお客様にLINEでキャンセル通知が送信されます。")) return;
  try {
    await api("/api/reservations/" + id + "/cancel", {method:"POST"});
    loadReservations();
  } catch(e) { alert("キャンセルに失敗しました"); }
}

// ━━━━━━━━━━━━━━━━━━━━━━
// 予約締切設定
// ━━━━━━━━━━━━━━━━━━━━━━
async function loadDeadline() {
  try {
    const res = await api("/api/settings/deadline");
    updateDeadlineUI(res.booking_deadline_hours);
  } catch(e) {
    document.getElementById("deadline-status").textContent = "設定を取得できませんでした";
  }
}

function updateDeadlineUI(hours) {
  const el = document.getElementById("deadline-status");
  if (hours === 0) {
    el.innerHTML = '🟢 <strong style="color:#2e7d32">今すぐ予約OK</strong> — 直前の予約を受け付けています';
  } else {
    el.innerHTML = '🔒 <strong>' + hours + '時間前に締切</strong> — ' + hours + '時間以内の枠は予約できません';
  }
  document.querySelectorAll(".deadline-btn").forEach(b => {
    b.classList.toggle("active", parseInt(b.dataset.hours) === hours);
  });
}

async function setDeadline(hours) {
  try {
    await api("/api/settings/deadline", { method:"POST", body: JSON.stringify({hours}) });
    updateDeadlineUI(hours);
  } catch(e) { alert("設定の変更に失敗しました"); }
}

// ━━━━━━━━━━━━━━━━━━━━━━
// スタッフ管理
// ━━━━━━━━━━━━━━━━━━━━━━
let staffData = [];
let selectedStaffId = null;

async function loadStaff() {
  const el = document.getElementById("staff-list");
  el.innerHTML = '<div class="loading">読み込み中...</div>';
  try {
    staffData = await api("/api/staff");
    renderStaff();
  } catch(e) {
    el.innerHTML = '<div class="empty">スタッフデータの取得に失敗しました</div>';
  }
}

function renderStaff() {
  const el = document.getElementById("staff-list");
  const active = staffData.filter(s => s.is_active !== false);
  if (!active.length) {
    el.innerHTML = '<div class="empty">スタッフが登録されていません</div>';
    return;
  }
  el.innerHTML = active.map(s => `
    <div class="staff-card">
      <div class="staff-info">
        <span class="staff-emoji">${s.emoji || '💇'}</span>
        <div>
          <div class="staff-name">${s.name}</div>
          <div class="staff-role">${s.role || 'スタイリスト'}　|　表示順: ${s.sort_order || 0}</div>
        </div>
      </div>
      <div class="staff-actions">
        <button class="btn btn-secondary btn-sm" onclick="openStaffDaysOff(${s.id},'${s.name}')">休日</button>
        <button class="btn btn-secondary btn-sm" onclick="editStaff(${s.id})">編集</button>
        <button class="btn btn-danger btn-sm" onclick="deleteStaff(${s.id},'${s.name}')">削除</button>
      </div>
    </div>
  `).join("");
}

function openStaffModal(staff) {
  document.getElementById("staff-modal-title").textContent = staff ? "スタッフ編集" : "スタッフ追加";
  document.getElementById("staff-edit-id").value = staff ? staff.id : "";
  document.getElementById("staff-name").value = staff ? staff.name : "";
  document.getElementById("staff-role").value = staff ? (staff.role || "スタイリスト") : "スタイリスト";
  document.getElementById("staff-emoji").value = staff ? (staff.emoji || "") : "💇";
  document.getElementById("staff-sort").value = staff ? (staff.sort_order || 0) : staffData.length;
  document.getElementById("staff-modal").classList.add("show");
}

function closeStaffModal() {
  document.getElementById("staff-modal").classList.remove("show");
}

function editStaff(id) {
  const s = staffData.find(x => x.id === id);
  if (s) openStaffModal(s);
}

async function saveStaff() {
  const id = document.getElementById("staff-edit-id").value;
  const name = document.getElementById("staff-name").value.trim();
  if (!name) { alert("名前を入力してください"); return; }

  const payload = {
    name: name,
    role: document.getElementById("staff-role").value,
    emoji: document.getElementById("staff-emoji").value || "💇",
    sort_order: parseInt(document.getElementById("staff-sort").value) || 0,
  };

  try {
    if (id) {
      await api("/api/staff/" + id, { method:"PATCH", body: JSON.stringify(payload) });
    } else {
      await api("/api/staff", { method:"POST", body: JSON.stringify(payload) });
    }
    closeStaffModal();
    loadStaff();
  } catch(e) { alert("保存に失敗しました"); }
}

async function deleteStaff(id, name) {
  if (!confirm(`「${name}」を削除しますか？\n※ 既存の予約データは残ります`)) return;
  try {
    await api("/api/staff/" + id, { method:"DELETE" });
    loadStaff();
    // 休日パネルが開いている場合は閉じる
    if (selectedStaffId === id) closeStaffDaysOff();
  } catch(e) { alert("削除に失敗しました"); }
}

// ━━━━━━━━━━━━━━━━━━━━━━
// スタッフ休日管理
// ━━━━━━━━━━━━━━━━━━━━━━
async function openStaffDaysOff(id, name) {
  selectedStaffId = id;
  document.getElementById("staff-off-title").textContent = `${name} の休日設定`;
  document.getElementById("staff-days-off-card").style.display = "block";
  loadStaffDaysOff();
}

function closeStaffDaysOff() {
  selectedStaffId = null;
  document.getElementById("staff-days-off-card").style.display = "none";
}

async function loadStaffDaysOff() {
  if (!selectedStaffId) return;
  try {
    const days = await api("/api/staff/" + selectedStaffId + "/days_off");
    renderStaffDaysOff(days);
  } catch(e) {
    document.getElementById("staff-off-recurring").innerHTML = '<div class="empty">取得に失敗しました</div>';
  }
}

function renderStaffDaysOff(days) {
  const recurring = days.filter(d => d.is_recurring);
  const specific = days.filter(d => !d.is_recurring && d.off_date);

  const recurEl = document.getElementById("staff-off-recurring");
  if (!recurring.length) {
    recurEl.innerHTML = '<div class="empty" style="padding:12px 0">定休は設定されていません</div>';
  } else {
    recurEl.innerHTML = recurring.map(d =>
      `<div class="closed-item">
        <span>毎週 <strong>${WEEKDAYS[d.day_of_week]}曜日</strong></span>
        <button class="btn btn-danger btn-sm" onclick="deleteStaffDayOff(${d.id})">削除</button>
      </div>`
    ).join("");
  }

  const specEl = document.getElementById("staff-off-specific");
  if (!specific.length) {
    specEl.innerHTML = '<div class="empty" style="padding:12px 0">個別の休日はありません</div>';
  } else {
    specEl.innerHTML = specific.map(d => {
      const dt = new Date(d.off_date + "T00:00:00");
      const label = (dt.getMonth()+1) + "/" + dt.getDate() + "（" + WEEKDAYS[dt.getDay()===0?6:dt.getDay()-1] + "）";
      return `<div class="closed-item">
        <span><strong>${label}</strong></span>
        <button class="btn btn-danger btn-sm" onclick="deleteStaffDayOff(${d.id})">削除</button>
      </div>`;
    }).join("");
  }
}

async function addStaffDayOff(type) {
  if (!selectedStaffId) return;
  let payload;
  if (type === "recurring") {
    const dow = parseInt(document.getElementById("staff-off-dow").value);
    payload = { day_of_week: dow, is_recurring: true };
  } else {
    const date = document.getElementById("staff-off-date").value;
    if (!date) { alert("日付を選択してください"); return; }
    payload = { off_date: date, is_recurring: false };
  }
  try {
    await api("/api/staff/" + selectedStaffId + "/days_off", {
      method: "POST", body: JSON.stringify(payload)
    });
    if (type === "specific") document.getElementById("staff-off-date").value = "";
    loadStaffDaysOff();
  } catch(e) { alert("追加に失敗しました"); }
}

async function deleteStaffDayOff(id) {
  if (!confirm("この休日設定を削除しますか？")) return;
  try {
    await api("/api/staff_days_off/" + id, { method:"DELETE" });
    loadStaffDaysOff();
  } catch(e) { alert("削除に失敗しました"); }
}

// ━━━━━━━━━━━━━━━━━━━━━━
// 定休日設定（店舗全体）
// ━━━━━━━━━━━━━━━━━━━━━━
async function loadClosedDays() {
  try {
    const days = await api("/api/closed_days");
    renderClosedDays(days);
  } catch(e) {
    document.getElementById("recurring-days").innerHTML = '<div class="empty">取得に失敗しました</div>';
  }
}

function renderClosedDays(days) {
  const recurring = days.filter(d => d.is_recurring);
  const specific = days.filter(d => !d.is_recurring && d.closed_date);

  const recurEl = document.getElementById("recurring-days");
  if (!recurring.length) {
    recurEl.innerHTML = '<div class="empty" style="padding:12px 0">定休日は設定されていません</div>';
  } else {
    recurEl.innerHTML = recurring.map(d => `
      <div class="closed-item">
        <span>毎週 <strong>${WEEKDAYS[d.day_of_week]}曜日</strong>（${d.reason || "定休日"}）</span>
        <button class="btn btn-danger btn-sm" onclick="deleteClosedDay(${d.id})">削除</button>
      </div>`).join("");
  }

  const specEl = document.getElementById("specific-days");
  if (!specific.length) {
    specEl.innerHTML = '<div class="empty" style="padding:12px 0">臨時休業日はありません</div>';
  } else {
    specEl.innerHTML = specific.map(d => {
      const dt = new Date(d.closed_date + "T00:00:00");
      const label = (dt.getMonth()+1) + "/" + dt.getDate() + "（" + WEEKDAYS[dt.getDay()===0?6:dt.getDay()-1] + "）";
      return `<div class="closed-item">
        <span><strong>${label}</strong> — ${d.reason || ""}</span>
        <button class="btn btn-danger btn-sm" onclick="deleteClosedDay(${d.id})">削除</button>
      </div>`;
    }).join("");
  }
}

async function addRecurring() {
  const dow = parseInt(document.getElementById("add-dow").value);
  try {
    await api("/api/closed_days", {
      method:"POST",
      body: JSON.stringify({ day_of_week: dow, reason: "定休日", is_recurring: true })
    });
    loadClosedDays();
  } catch(e) { alert("追加に失敗しました"); }
}

async function addSpecific() {
  const date = document.getElementById("add-date").value;
  const reason = document.getElementById("add-reason").value || "臨時休業";
  if (!date) { alert("日付を選択してください"); return; }
  try {
    await api("/api/closed_days", {
      method:"POST",
      body: JSON.stringify({ closed_date: date, reason, is_recurring: false })
    });
    document.getElementById("add-date").value = "";
    document.getElementById("add-reason").value = "";
    loadClosedDays();
  } catch(e) { alert("追加に失敗しました"); }
}

async function deleteClosedDay(id) {
  if (!confirm("この定休日設定を削除しますか？")) return;
  try {
    await api("/api/closed_days/" + id, { method:"DELETE" });
    loadClosedDays();
  } catch(e) { alert("削除に失敗しました"); }
}

// ━━━━━━━━━━━━━━━━━━━━━━
// 顧客リスト
// ━━━━━━━━━━━━━━━━━━━━━━
async function loadCustomers() {
  const tbody = document.getElementById("cust-body");
  tbody.innerHTML = '<tr><td colspan="5" class="loading">読み込み中...</td></tr>';
  try {
    const rows = await api("/api/customers");
    renderCustomers(rows);
    renderCustStats(rows);
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">データの取得に失敗しました</td></tr>';
  }
}

function renderCustomers(rows) {
  const tbody = document.getElementById("cust-body");
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">顧客データはまだありません</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(c => `<tr>
    <td><strong>${c.display_name || "未設定"}</strong></td>
    <td>${c.phone || "-"}</td>
    <td>${c.visit_count || 0}回</td>
    <td>${c.last_visit_date || "-"}</td>
    <td>${c.created_at ? c.created_at.slice(0,10) : "-"}</td>
  </tr>`).join("");
}

function renderCustStats(rows) {
  const total = rows.length;
  const repeaters = rows.filter(c => (c.visit_count || 0) >= 2).length;
  document.getElementById("customer-stats").innerHTML = `
    <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">総顧客数</div></div>
    <div class="stat-card"><div class="stat-number">${repeaters}</div><div class="stat-label">リピーター（2回以上）</div></div>
  `;
}

loadDeadline();
loadReservations();
</script>
